name: Scheduler Canary V2

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: read

    steps:
      - name: Prove scheduler event
        run: echo "scheduler-canary-v2 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
