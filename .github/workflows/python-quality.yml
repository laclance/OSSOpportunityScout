name: Python Quality

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - "**/*.py"
      - ".coveragerc"
      - "mypy.ini"
      - "ruff.toml"
      - "requirements-dev.txt"
      - "Makefile"
      - ".github/workflows/python-quality.yml"
      - "action.yml"
      - "examples/**"
      - "scout.example.toml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python
        run: python -m compileall -q opportunity_scout.py opportunity_scout tests

      - name: Type check with mypy
        run: mypy

      - name: Run tests with branch coverage
        run: coverage run --branch -m unittest -v

      - name: Enforce coverage
        run: coverage report

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: make compile

      - name: Install offline workflow validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run compatibility tests
        run: python -m unittest -v
