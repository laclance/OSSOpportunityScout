name: Python Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev
    paths:
      - "**/*.py"
      - ".coveragerc"
      - "mypy.ini"
      - "ruff.toml"
      - "requirements-dev.txt"
      - "Makefile"
      - ".github/workflows/python-quality.yml"
      - "action.yml"
      - "examples/**"
      - "scout.example.toml"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  branch-flow:
    name: branch-flow
    runs-on: ubuntu-24.04
    steps:
      - name: Enforce protected branch flow
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CURRENT_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$BASE_REF" = "main" ]; then
            if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPOSITORY" != "$CURRENT_REPOSITORY" ]; then
              echo "::error::Pull requests to main must come from this repository's dev branch."
              exit 1
            fi
          fi

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Compile Python
        run: python -m compileall -q opportunity_scout.py opportunity_scout tests

      - name: Type check with mypy
        run: mypy

      - name: Run tests with branch coverage
        run: coverage run --branch -m unittest -v

      - name: Enforce coverage
        run: coverage report

  compatibility:
    name: Python ${{ matrix.python-version }} compatibility
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python
        run: make compile

      - name: Install offline workflow validation dependency
        run: python -m pip install PyYAML==6.0.3

      - name: Run compatibility tests
        run: python -m unittest -v
