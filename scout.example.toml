# Generic version-1 preferences. Opt in with --config PATH; no automatic loading.
# Slice 3A applies lanes, repositories/exclusions, and strategic global_search.
# Slice 3B applies primary repository languages across both lanes.
# Slice 3C applies final effort estimates; thresholds/result limits await Slice 3D.
# Keep credentials and delivery configuration outside this file.
version = 1
# Optional non-secret display name:
# name = "Weekend scout"

[lanes]
paid = true
strategic = true

[discovery]
# Match cached primary repository language case-insensitively; no extra searches.
# Empty accepts every language; explicit entries exclude unknown languages.
languages = []
# Add curated strategic sources; this is not an allowlist.
repositories = []
# Exclusions take precedence across both lanes and resolved upstream sources.
exclude_repositories = []
# Controls strategic global searches only, not paid discovery.
global_search = true

[preferences]
# Accept final estimates without changing estimation policy; empty accepts none.
effort = ["<1h", "1–3h", "3–6h", "6–12h", "1d+"]
# Final paid candidates use cash; final unpaid candidates use career.
min_career_score = 55
min_cash_score = 55
max_results = 8
